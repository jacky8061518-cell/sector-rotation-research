name: Daily Taiwan market-data update

on:
  workflow_dispatch:
  schedule:
    # 10:00 UTC = 18:00 Asia/Taipei.  This leaves time after the 13:30 close
    # for official institutional files and public branch summaries to settle.
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh prices, institutional flows, and snapshots
        run: python scripts/daily_update.py

      - name: Verify refreshed Taiwan data
        run: |
          python - <<'PY'
          import pandas as pd

          prices = pd.read_parquet("data/databases/tw/adjusted-prices.parquet")
          flows = pd.read_parquet("data/databases/tw/institutional-flows.parquet")
          branches = pd.read_parquet("data/databases/tw/broker-branches.parquet")
          revenue = pd.read_parquet("data/databases/tw/monthly-revenue.parquet")
          factor_snapshot = pd.read_parquet("data/snapshots/tw/latest-factor-snapshot.parquet")
          price_date = pd.to_datetime(prices.index).max().normalize()
          flow_date = pd.to_datetime(flows["Date"]).max().normalize()
          branch_date = pd.to_datetime(branches["Date"]).max().normalize()
          branch_stocks = branches["Ticker"].astype(str).nunique()
          horizon_stocks = (
              branches.groupby("Horizon")["Ticker"].nunique().to_dict()
              if "Horizon" in branches
              else {}
          )
          if (price_date - flow_date).days > 7:
              raise SystemExit(
                  f"Institutional-flow cache is stale: prices={price_date:%Y-%m-%d}, "
                  f"flows={flow_date:%Y-%m-%d}"
              )
          incomplete_horizons = {
              horizon: horizon_stocks.get(horizon, 0)
              for horizon in ["Daily", "Weekly", "Monthly"]
              if horizon_stocks.get(horizon, 0) < 8
          }
          if incomplete_horizons or (price_date - branch_date).days > 10:
              raise SystemExit(
                  f"Broker-branch cache is incomplete: horizons={horizon_stocks}, "
                  f"branches={branch_date:%Y-%m-%d}, prices={price_date:%Y-%m-%d}"
              )
          print(f"Taiwan prices through {price_date:%Y-%m-%d}")
          print(f"Taiwan institutional flows through {flow_date:%Y-%m-%d}")
          print(
              f"Broker branches through {branch_date:%Y-%m-%d}: "
              f"{branch_stocks} unique stocks, {horizon_stocks}"
          )
          print(
              f"Monthly revenue: {len(revenue):,} point-in-time rows; "
              f"factor snapshot: {len(factor_snapshot):,} stocks"
          )
          PY

      - name: Commit refreshed database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/databases data/snapshots/tw/latest-factor-snapshot.*
          if git diff --cached --quiet; then
            echo "No market-data changes"
          else
            git commit -m "Update daily Taiwan market data"
            git push
          fi
