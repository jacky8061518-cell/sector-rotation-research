[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sector-rotation-research"
version = "0.8.0"
description = "Fund-flow-first Taiwan research with institutional Sankey, radar, timelines, reasons, and price confirmation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pyarrow>=18,<25",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<1",
    "streamlit>=1.41,<2",
    "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2", "pytest>=8,<9", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 125
include = ["src/factors/**/*.py", "tests/factors/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/factors"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas.*", "plotly.*", "scipy.*", "statsmodels.*"]
ignore_missing_imports = true
